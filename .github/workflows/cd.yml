---
name: CD
permissions:
  contents: write
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
jobs:
  build:
    name: Continuous Deployment
    runs-on: ubuntu-latest
    if: ${{ github.repository == 'bit0x43/pymetasnap' && github.event.workflow_run.conclusion == 'success' }}
    outputs:
      version: ${{ steps.update-package-version.outputs.PACKAGE_VERSION }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install poetry
          npm install -g auto-changelog
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Determine Version Bump
        id: determine_version_bump
        run: |
          MESSAGE=$(git log -1 --pretty=format:'%s')
          if [[ $MESSAGE == build* ]]; then
              echo "bump=patch" >> "$GITHUB_OUTPUT"
          else
              echo "bump=minor" >> "$GITHUB_OUTPUT"
          fi
      - name: Update package version
        id: update-package-version
        run: |
          poetry version ${{ steps.determine_version_bump.outputs.bump }}
          echo "PACKAGE_VERSION=$(poetry version --short)" >> "$GITHUB_OUTPUT"
          git add pyproject.toml
          git commit -m "Bump ${{ steps.determine_version_bump.outputs.bump }} version"
          git push
      - name: Create Tag
        env:
          PACKAGE_VERSION: ${{ steps.update-package-version.outputs.PACKAGE_VERSION }}
        run: |
          git tag -a "$PACKAGE_VERSION" -m "chore: Bumping $PACKAGE_VERSION"
          git push origin "$PACKAGE_VERSION"
          auto-changelog
          git add CHANGELOG.md
          git commit -m "chore: updating changelog"
          git push origin main
  publish:
    name: Publish to PyPI
    needs: build
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.build.outputs.version }}
    secrets: inherit
  on-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    steps:
      - run: echo 'The triggering workflow failed'
